[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "governer"
version = "1.0.2"
description = "Hard spend breaker for AI agents — prices cache reads, bills real usage, and refuses the request that would cross your budget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaiser0733", email = "amardeepkumar0733@gmail.com" }]
keywords = ["ai", "agents", "llm", "cost", "finops", "budget", "tokens", "openai", "anthropic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Kaiser0733/governer"
Issues = "https://github.com/Kaiser0733/governer/issues"
Changelog = "https://github.com/Kaiser0733/governer/blob/main/CHANGELOG.md"

[project.scripts]
governer = "governer:main"

[tool.setuptools]
py-modules = ["governer"]
