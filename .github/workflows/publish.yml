name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the package
        run: |
          python3 -m pip install --quiet build
          python3 -m build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
